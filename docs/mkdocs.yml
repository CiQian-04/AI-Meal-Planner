site_name: AI 菜谱规划师
site_description: 基于 Spring AI Function Calling 与结构化输出的家庭菜谱规划服务

# 换成你自己的仓库地址：site_url 决定 GitHub Pages 的站点根路径，
# repo_url 决定页面右上角「查看源码」和「编辑此页」的跳转目标。
site_url: https://ciqian-04.github.io/AI-Meal-Planner/
repo_url: https://github.com/CiQian-04/AI-Meal-Planner
repo_name: AI-Meal-Planner
edit_uri: edit/main/docs/

# The config file lives inside docs/, so paths are resolved relative to it.
docs_dir: .
site_dir: ../site

# These live next to the markdown but are not pages — keep them out of the published site.
# openapi.json is intentionally left in: it is the published machine-readable spec.
exclude_docs: |
  requirements.txt
  export_openapi.py
  mkdocs.yml

theme:
  name: material
  language: zh
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
  icon:
    repo: fontawesome/brands/github

nav:
  - 首页: index.md
  - 快速开始: quickstart.md
  - 架构设计: architecture.md
  - API 参考: api.md
  - OpenAPI 规范: openapi.md
  - 开发指南: development.md
  - 运维与发布: operations.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - footnotes

plugins:
  - search
