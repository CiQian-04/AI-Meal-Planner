site_name: AI 菜谱规划师
site_description: 基于 Spring AI Function Calling 与结构化输出的家庭菜谱规划服务
site_url: https://example.github.io/meal-planner/
repo_url: https://github.com/example/meal-planner
repo_name: meal-planner
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
  icon:
    repo: fontawesome/brands/github

nav:
  - 首页: index.md
  - 快速开始: quickstart.md
  - 架构设计: architecture.md
  - API 参考: api.md
  - 开发指南: development.md
  - 运维与发布: operations.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - footnotes

plugins:
  - search
  - redirects:
      redirect_maps:
        api-reference: api.md
