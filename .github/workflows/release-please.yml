name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Force a release type: major | minor | patch'
        required: false
        type: string
      publish_tag:
        description: 'Republish assets/images for an existing tag (e.g. v0.2.0)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}
          bump-minor-pre-major: false
          bump-patch-for-minor-pre-major: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish release artifacts
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' || inputs.publish_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      RELEASE_TAG: ${{ inputs.publish_tag || needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build backend jar
        working-directory: backend
        run: mvn -B -ntp package -DskipTests

      - name: Build frontend
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build

      # Do not write `tar -C backend/target *.jar`: the shell expands *.jar in the
      # current directory before tar enters -C, so the glob never matches the jar.
      - name: Package backend jar
        run: tar -czf "meal-planner-backend-${RELEASE_TAG}.tar.gz" -C backend/target "$(basename "$(find backend/target -maxdepth 1 -name '*.jar' | head -n 1)")"

      - name: Package frontend dist
        run: tar -czf "meal-planner-frontend-${RELEASE_TAG}.tar.gz" -C frontend/dist .

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            meal-planner-backend-${{ env.RELEASE_TAG }}.tar.gz
            meal-planner-frontend-${{ env.RELEASE_TAG }}.tar.gz

      - uses: docker/setup-buildx-action@v3

      # GHCR image names must be lowercase; github.repository may contain capitals.
      - name: Compute lowercase image base
        run: echo "IMAGE_BASE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/backend:${{ env.RELEASE_TAG }}
            ${{ env.IMAGE_BASE }}/backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/frontend:${{ env.RELEASE_TAG }}
            ${{ env.IMAGE_BASE }}/frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
