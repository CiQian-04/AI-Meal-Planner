name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Force a release type: major | minor | patch'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}
          bump-minor-pre-major: false
          bump-patch-for-minor-pre-major: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish release artifacts
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build backend jar
        working-directory: backend
        run: mvn -B -ntp package -DskipTests

      - name: Build frontend
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build

      - name: Package backend jar
        run: tar -czf meal-planner-backend-${{ needs.release-please.outputs.tag_name }}.tar.gz -C backend/target *.jar

      - name: Package frontend dist
        run: tar -czf meal-planner-frontend-${{ needs.release-please.outputs.tag_name }}.tar.gz -C frontend/dist .

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            meal-planner-backend-${{ needs.release-please.outputs.tag_name }}.tar.gz
            meal-planner-frontend-${{ needs.release-please.outputs.tag_name }}.tar.gz

      - uses: docker/setup-buildx-action@v3

      # GHCR image names must be lowercase; github.repository may contain capitals.
      - name: Compute lowercase image base
        run: echo "IMAGE_BASE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/backend:${{ needs.release-please.outputs.tag_name }}
            ${{ env.IMAGE_BASE }}/backend:latest

      - name: Push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/frontend:${{ needs.release-please.outputs.tag_name }}
            ${{ env.IMAGE_BASE }}/frontend:latest
