name: Container Scan

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  schedule:
    - cron: '33 5 * * 2'

permissions:
  contents: read
  security-events: write

jobs:
  trivy:
    name: Scan container images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - name: backend
            context: ./backend
          - name: frontend
            context: ./frontend

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          push: false
          load: true
          tags: meal-planner-${{ matrix.image.name }}:scan

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: meal-planner-${{ matrix.image.name }}:scan
          format: sarif
          output: trivy-${{ matrix.image.name }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.image.name }}.sarif
          category: trivy-${{ matrix.image.name }}

      - name: Fail on critical findings
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: meal-planner-${{ matrix.image.name }}:scan
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: ${{ matrix.image.context }}/.trivyignore
