server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: meal-planner-backend

  # The OpenAI starter is used as a generic OpenAI-compatible client.
  # Default to DeepSeek's official endpoint (mainland-China reachable);
  # override with OPENAI_BASE_URL / OPENAI_MODEL for relays, Qwen, Ollama, etc.
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:sk-not-configured}
      base-url: ${OPENAI_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${OPENAI_MODEL:deepseek-flash}
          temperature: 0.4
          # This model is a reasoning model: tokens spent on thinking count against
          # max-tokens. Too small a budget leaves an empty content payload, or worse,
          # a JSON plan that gets cut off mid-object ("No content to map" /
          # "模型没有返回 JSON"). DeepSeek-V4.1 supports very large outputs, so give
          # the full multi-day plan room to finish in one response.
          max-tokens: ${OPENAI_MAX_TOKENS:32768}

    # The retry prefix is `spring.ai.retry`, NOT `spring.ai.openai.retry`. Keep it at 1 so a
    # single 524 from the relay does not turn into a 90-second exponential backoff inside one
    # planning request.
    retry:
      max-attempts: 1

  mvc:
    problemdetails:
      # Off so GlobalExceptionHandler's ApiError (with `message` and `fieldErrors`)
      # actually reaches the client. With ProblemDetail on, Spring rewrites every
      # error into RFC 7807 (`detail` field), which the frontend cannot read.
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.mealplanner: INFO
    org.springframework.ai: INFO
