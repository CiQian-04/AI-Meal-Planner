server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: meal-planner-backend

  # The OpenAI starter is used as a generic OpenAI-compatible client.
  # Default to DeepSeek (directly reachable in mainland China); override with
  # OPENAI_BASE_URL / OPENAI_MODEL for OpenAI, Qwen, Ollama, etc.
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:sk-not-configured}
      base-url: ${OPENAI_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${OPENAI_MODEL:deepseek-flash}
          temperature: 0.4
      # Enable retry so a transient upstream failure does not fail the whole planning request.
      retry:
        max-attempts: 2

  mvc:
    problemdetails:
      # Off so GlobalExceptionHandler's ApiError (with `message` and `fieldErrors`)
      # actually reaches the client. With ProblemDetail on, Spring rewrites every
      # error into RFC 7807 (`detail` field), which the frontend cannot read.
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.mealplanner: INFO
    org.springframework.ai: INFO
