# AI 菜谱规划师 —— 本地与 CI 一致的编排
#
# 用法：
#   docker compose up --build
#   打开 http://localhost:5173
#
# 需要模型服务时，把 OPENAI_BASE_URL 指向你的 OpenAI 兼容端点；
# 没有可用 Key 时，可用仓库自带的 mock server 先跑通全链路：
#   python tools/mock_openai_server.py --port 8090
#   OPENAI_BASE_URL=http://host.docker.internal:8090 OPENAI_API_KEY=mock

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: meal-planner-backend
    ports:
      - "8080:8080"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-not-configured}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.deepseek.com}
      OPENAI_MODEL: ${OPENAI_MODEL:-deepseek-chat}
      SPRING_PROFILES_ACTIVE: prod
    extra_hosts:
      # 让容器可以访问宿主机上运行的 mock server 或本地模型
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: meal-planner-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
